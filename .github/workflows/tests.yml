name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run test suite
        run: python -m pytest -q
      - name: Byte-compile all skill scripts
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          bad = []
          targets = list(pathlib.Path("skills").rglob("scripts/**/*.py")) \
                  + list(pathlib.Path("engine").rglob("*.py")) \
                  + list(pathlib.Path("scripts").rglob("*.py"))
          for p in targets:
              try:
                  py_compile.compile(str(p), doraise=True)
              except py_compile.PyCompileError as e:
                  bad.append(str(p)); print(e)
          sys.exit(1 if bad else 0)
          PY

  consistency:
    # Fail-closed CI gates that guard the plugin's safety/consistency invariants (scripts/ci/).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Safety-substring drift canary
        run: python scripts/ci/check_invariants.py
      - name: Agent guardrail floor
        run: python scripts/ci/check_constitution.py
      - name: Skill-tree lockfile
        run: python scripts/ci/verify_skills_lock.py
      - name: Shell-injection ban (os.system/os.popen/shell=True)
        run: python scripts/ci/check_subprocess_discipline.py
      - name: Plugin manifest + hook-wiring consistency
        run: python scripts/ci/check_plugin_manifest.py
      - name: Scored-judge frozen-baseline self-test
        run: python scripts/ci/agent_eval_selftest.py --selftest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all shell scripts
        run: |
          set -e
          find skills -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f" && echo "ok: $f"
          done
